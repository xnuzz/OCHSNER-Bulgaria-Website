# Push to main -> build -> upload changed files to SuperHosting (public_html/ochsner.bg/public).
# Setup: docs/superhosting-deploy.md, section "Automatic deploys".
name: Deploy to SuperHosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-superhosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: npm install && npm run package:superhosting
        env:
          # Optional: live social posts baked in at build time; without it, curated posts.
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./frontend/dist/
          server-dir: ./
