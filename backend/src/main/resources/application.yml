spring:
  application:
    name: ochsner-bg-site

  datasource:
    url: jdbc:h2:file:./data/ochsner-bg;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  # spring.mail.host is intentionally absent in dev. Setting it to an empty string
  # still triggers MailSenderAutoConfiguration, and the resulting health indicator
  # cannot reach a server, which takes /actuator/health DOWN (503). With the key
  # missing, no JavaMailSender is created and MailConfig falls back to the logging
  # mailer. The prod profile supplies a real host.
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

site:
  mail:
    recipient: office@omnia-contractors.com
    from: no-reply@ochsner.bg
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    bg.ochsner.site: INFO
