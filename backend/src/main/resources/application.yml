spring:
  application:
    name: ochsner-bg-site

  datasource:
    url: jdbc:h2:file:./data/ochsner-bg;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  # No host configured -> the app falls back to the logging mailer (see MailConfig).
  mail:
    host: ""
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

site:
  mail:
    recipient: office@ochsner.bg
    from: no-reply@ochsner.bg
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    bg.ochsner.site: INFO
