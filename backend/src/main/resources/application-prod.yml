# Production profile: PostgreSQL + real SMTP. All secrets come from the environment.
# Run with: java -jar app.jar --spring.profiles.active=prod
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ochsner_bg}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Switch to `validate` once a migration tool (Flyway/Liquibase) owns the schema.
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: false

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

site:
  mail:
    recipient: ${NOTIFY_EMAIL:office@ochsner.bg}
    from: ${MAIL_FROM:no-reply@ochsner.bg}
  cors:
    allowed-origins:
      - ${SITE_ORIGIN:https://ochsner.bg}

logging:
  level:
    bg.ochsner.site: INFO
    org.hibernate.SQL: WARN
